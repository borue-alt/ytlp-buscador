<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E52713">
<title>Buscador YTLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Colorimetría Vinatea & Toyama: fondo blanco y detalles en rojo (#E52713, tomado del logo). Sin negro como color de diseño; el texto usa gris oscuro por legibilidad. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F5; --ink:#333333; --ink-2:#6E6E6E; --line:#E5E5E5;
  --brand:#E52713; --brand-ink:#FFFFFF; --brand-soft:#FDECE9; --brand-dark:#B81F0F;
  --auto:#B81F0F; --auto-soft:#FDECE9; --warn:#8A5A00; --warn-soft:#FBF1DC; --bad:#B81F0F; --bad-soft:#FDECE9; --adj:#B81F0F; --adj-soft:#FDECE9;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -14px rgba(229,39,19,.35);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:14px} .xs{font-size:12.5px}
.hide{display:none!important}

/* Top */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--brand);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .app{border-left:2px solid var(--brand);padding-left:10px}
.brand b{font-size:15px;font-weight:800;color:var(--brand);white-space:nowrap}
.brand span{display:block;font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px}
.src{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.src.mock{background:var(--warn-soft);color:var(--warn)} .src.live{background:var(--brand-soft);color:var(--brand)}
.bnav{display:none}

main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--brand-soft);color:var(--brand)} .chip.vig{background:var(--surface);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.auto{background:var(--auto-soft);color:var(--auto)} .chip.adj{background:var(--adj-soft);color:var(--adj)}
.ext{flex:none;display:inline-grid;place-items:center;min-width:42px;height:42px;font-size:11px;font-weight:800;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.ext.pdf{background:var(--bad-soft);color:var(--bad)} .ext.docx,.ext.xlsx,.ext.img{background:var(--surface-2);color:var(--ink-2)}

/* Search hero */
.hero{padding:20px 22px;margin-bottom:18px;border-top:4px solid var(--brand)}
.howto{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:0;list-style:none}
.howto li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);background:var(--brand-soft);border-radius:30px;padding:5px 12px 5px 5px}
.howto li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:13px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero>p{color:var(--ink-2);margin:4px 0 14px}
.sform{display:flex;gap:10px}
.sbox{flex:1;position:relative;min-width:0}
.sbox svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--ink-2)}
.sbox input{width:100%;padding:14px 44px 14px 44px;font-size:17px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox input:focus{border-color:var(--brand);outline:none}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--ink-2);font-size:20px}
.sform .btn{padding:0 22px;font-size:17px;border-radius:14px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13.5px;color:var(--ink-2)}
.examples button:hover{border-color:var(--brand);color:var(--ink)}
.understood{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13.5px}
.understood .chip{font-size:13px;padding:3px 6px 3px 10px}
.understood .chip button{border:0;background:transparent;color:inherit;width:20px;height:20px;border-radius:50%;padding:0;line-height:1}
.understood .chip button:hover{background:color-mix(in srgb,currentColor 15%,transparent)}

/* Layout */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.layout>section{min-width:0}
.filters{padding:16px 18px;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fhead h2{font-size:17px;flex:1}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:13.5px;font-weight:700}
.field select,.field input[type=text],.field input[type=date],.field input[type=search],.field input[type=url]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.combo{position:relative}
.combo input{width:100%;padding:9px 34px 9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.combo input:focus{outline:none;border-color:var(--brand)}
.combo .cclr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:28px;height:28px;border-radius:8px;color:var(--ink-2);font-size:18px}
.clist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.25);max-height:240px;overflow:auto}
.clist li{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;font-size:15px;cursor:pointer}
.clist li small{color:var(--ink-2)}
.clist li.act,.clist li:hover{background:var(--brand-soft);color:var(--brand-dark)}
.clist li.none{color:var(--ink-2);cursor:default;background:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 span{font-size:12px;color:var(--ink-2)}
.checks{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;padding-right:4px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:4px 2px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--surface-2)}
.checks label .n{margin-left:auto;font-size:12px;color:var(--ink-2)}
.checks input,.tgl input{accent-color:var(--brand);width:17px;height:17px;flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tgl{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;cursor:pointer}
.tgl small{display:block;color:var(--ink-2);font-size:12.5px}
.fnote{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sheetbar{display:none}

/* Results */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{font-size:18px}
.rhead .grow{min-width:8px}
.rhead select{padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.fbtn{display:none}
.timing{font-size:13px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:left;width:100%}
.rcard:hover{border-color:var(--brand)}
.rcard.best{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.rcard.old{}
.rcard .i{flex:1;min-width:0}
.rcard .i b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .path{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rcard mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.rcard .go{flex:none}
.more{margin-top:12px;text-align:center}
.pendbox{border:1px solid var(--adj);background:var(--adj-soft);border-radius:14px;padding:12px 14px;margin-top:14px}
.pendbox h3{font-size:15px;color:var(--adj);margin-bottom:4px}
.pendbox li{font-size:14px}
.nores{border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--surface)}
.nores h3{font-size:17px;margin-bottom:8px}
.nores ul{margin:0 0 14px;padding-left:20px;font-size:14.5px}
.nores li{margin-bottom:5px}
.mailbox{background:var(--brand-soft);border-radius:12px;padding:12px;margin-top:4px}
.welcome{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.welcome .panel{padding:16px}
.welcome b{display:block;font-size:28px;font-weight:800;color:var(--brand)}
.welcome span{font-size:13.5px;color:var(--ink-2)}
.recent{margin-top:16px}
.recent h3{font-size:15px;margin-bottom:8px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,20,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:din .2s ease-out}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dh h3{flex:1;font-size:17px;word-break:break-word}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0}
dl.meta dt{color:var(--ink-2)} dl.meta dd{margin:0;font-weight:600;word-break:break-word}
.confirm{background:var(--brand-soft);border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.confirm .btn{background:var(--surface)}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.6;max-height:260px;overflow:auto}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.sec h4{font-size:13px;color:var(--ink-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}

/* Registro / Conexión */
.page{max-width:980px}
.page h1{font-size:24px;font-weight:800;margin-bottom:4px}
.page>p{color:var(--ink-2);margin-bottom:16px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
.t th{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpis span{display:block;font-size:12.5px;color:var(--ink-2)}
.kpis b{font-size:24px;font-weight:800}
.blk{padding:18px;margin-bottom:14px}
.blk h2{font-size:18px;margin-bottom:6px}
.blk>p{font-size:14.5px;color:var(--ink-2);margin-bottom:12px}
.steps{margin:0;padding-left:20px;font-size:14.5px}
.steps li{margin-bottom:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-word}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.maptbl input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:ui-monospace,Menlo,monospace;font-size:13px}
.status{border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px}
.status.ok{background:var(--brand-soft);color:var(--brand)} .status.bad{background:var(--bad-soft);color:var(--bad)} .status.run{background:var(--auto-soft);color:var(--auto)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:500;box-shadow:var(--shadow);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .fbtn{display:inline-flex}
  .filters{display:none;position:fixed;inset:auto 0 0 0;top:auto;z-index:55;max-height:86vh;border-radius:18px 18px 0 0;padding:0 16px;box-shadow:0 -12px 40px -10px rgba(0,0,0,.4);animation:up .22s ease-out}
  .filters.open{display:block}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheetbar{display:flex;position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));gap:8px;border-top:1px solid var(--line);margin-top:6px}
  .sheetbar .btn{flex:1}
  .filters .fhead{position:sticky;top:0;background:var(--surface);padding:14px 0 10px;margin:0;z-index:1}
  .filters .fhead::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
  .fscrim{position:fixed;inset:0;background:rgba(10,18,20,.45);z-index:54}
  .welcome{grid-template-columns:1fr 1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topin{padding:8px 14px;gap:8px}
  .tabs{display:none}
  .brand span{display:none}
  .who label{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:600;padding:4px 0;border-radius:10px}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
  main{padding:14px 14px 96px}
  .hero{padding:16px;border-radius:14px}
  .hero h1{font-size:21px}
  .sform{flex-direction:column}
  .sform .btn{padding:12px}
  .examples{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}
  .examples button{flex:none;white-space:nowrap}
  .brand{flex:1;overflow:hidden}
  .brand .app{display:none}
  .brand img{height:26px;max-width:100%;object-fit:contain;object-position:left}
  .howto{display:none}
  .src{display:none}
  .who select{max-width:130px}
  .welcome{grid-template-columns:repeat(3,1fr)!important;gap:8px}
  .welcome .panel{padding:10px 12px}
  .welcome b{font-size:22px}
  .welcome span{font-size:12px;line-height:1.3;display:block}
  .rcard{padding:12px;gap:10px;align-items:flex-start}
  .rcard .go{display:none}
  .ext{min-width:38px;height:38px}
  .t{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const DEFAULT_MAP={nombre:'FileLeafRef',cliente:'Cliente',tipo:'TipoDocumental',fecha:'FechaDocumento',vigencia:'Vigencia',hasta:'VigenteHasta',

let msalApp=null;
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
class NeedLogin extends Error{constructor(){super('Falta iniciar sesión')}}
// Permiso mínimo: Sites.Selected (delegado). La app solo puede leer los sitios que un administrador le asignó (YTLP),
// y además solo lo que el usuario ya puede ver en SharePoint. Nada se envía a servicios externos.
const SCOPES=['Sites.Selected'];
async function ensureMsal(cfg){
  if(!window.msal) await loadScript('https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js');
  if(!msalApp){
    msalApp=new msal.PublicClientApplication({auth:{clientId:cfg.clientId,authority:'https://login.microsoftonline.com/'+cfg.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await msalApp.initialize();
    const r=await msalApp.handleRedirectPromise();          // vuelve del inicio de sesión de Microsoft
    if(r&&r.account) msalApp.setActiveAccount(r.account);
  }
}
// interactive=false: solo usa una sesión guardada (al abrir la página). true: redirige a Microsoft (tras un toque del usuario).
async function getToken(cfg,interactive){
  await ensureMsal(cfg);
  const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
  if(!acct){if(!interactive) throw new NeedLogin();await msalApp.loginRedirect({scopes:SCOPES});return new Promise(()=>{})}
  try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct})).accessToken}
  catch(e){if(!interactive) throw new NeedLogin();await msalApp.acquireTokenRedirect({scopes:SCOPES,account:acct});return new Promise(()=>{})}
}
async function graph(token,path,opt={}){
  const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly',...(opt.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error('Graph '+r.status+': '+t.slice(0,240))}
  return r.json();
}
function fv(v){if(v==null) return null;if(typeof v==='object') return v.Label||v.LookupValue||v.Email||v.title||null;return v}
const GraphSource={
  name:'SharePoint',
  async load(cfg,interactive){
    const token=await getToken(cfg,interactive);
    const u=new URL(cfg.siteUrl);
    const site=await graph(token,`/sites/${u.hostname}:${u.pathname.replace(/\/$/,'')}`);
    const list=await graph(token,`/sites/${site.id}/lists/${encodeURIComponent(cfg.library)}`);
    const M=cfg.map;const out=[];
    // Trae todas las filas (paginado). Con miles de documentos conviene filtrar por Estado en el servidor (columna indexada).
    let next=`/sites/${site.id}/lists/${list.id}/items?$expand=fields&$top=500`;
    while(next&&out.length<20000){
      const page=await graph(token,next);
      page.value.forEach(it=>{
        const f=it.fields||{};
        if(((it.contentType&&it.contentType.id)||'').startsWith('0x0120')||f.ContentType==='Folder'||f.ContentType==='Carpeta'||f.FSObjType==='1') return; // carpetas
        const cliTxt=fv(f[M.cliente]);const cli=CLIENTS.find(c=>norm(c.nombre)===norm(cliTxt)||norm(c.corto)===norm(cliTxt)||c.id===cliTxt);
        const tipTxt=fv(f[M.tipo]);const tip=TIPOS.find(t=>t.id===tipTxt||norm(t.nombre)===norm(tipTxt)||norm(t.corto)===norm(tipTxt));
        out.push(normDoc({id:'g'+it.id,spId:it.id,nombre:fv(f[M.nombre])||it.name||'(sin nombre)',clienteId:cli?cli.id:cliTxt,tipo:tip?tip.id:(tipTxt||'OTRO'),
          fecha:(fv(f[M.fecha])||'').slice(0,10)||null,vigencia:fv(f[M.vigencia])||'—',hasta:(fv(f[M.hasta])||'').slice(0,10)||null,
          trabajador:fv(f[M.trabajador]),abogado:fv(f[M.abogado])||fv(it.createdBy&&it.createdBy.user&&it.createdBy.user.displayName),
          estado:fv(f[M.estado])||'Validado',reemplazadoPor:fv(f[M.reemplazadoPor])||null,
          recepciones:+fv(f[M.recepciones])||1,origen:fv(f[M.origen]),conf:fv(f[M.confianza]),registrado:(it.createdDateTime||'').slice(0,10),
          size:+f.File_x0020_Size||+f.FileSizeDisplay||null,url:it.webUrl,texto:''}));
      });
      next=page['@odata.nextLink'];
    }
    this._token=token;
    return out;
  },
  // Búsqueda dentro del contenido (texto del PDF/Word) con Microsoft Search. Devuelve URLs que coinciden.
  async contentHits(cfg,text){
    if(!this._token||!text) return null;
    const body={requests:[{entityTypes:['listItem'],query:{queryString:`${text} path:"${cfg.siteUrl}"`},from:0,size:200,fields:['webUrl']}]};
    const r=await graph(this._token,'/search/query',{method:'POST',body:JSON.stringify(body)});
    const hits=((r.value||[])[0]||{}).hitsContainers||[];
    return new Set(hits.flatMap(h=>(h.hits||[]).map(x=>decodeURIComponent((x.resource&&x.resource.webUrl)||''))));
  }
};

function parseQuery(q){
  const n=norm(q);const out={cliente:null,tipos:[],year:null,trabajador:null,vigente:false,rest:[]};
  const cli=CLIENTS.find(c=>c.alias.concat([norm(c.corto)]).some(a=>new RegExp('(^|[^a-z])'+reEsc(norm(a))+'($|[^a-z])').test(n)));

  TIPOS.forEach(t=>{if(t.q.some(k=>new RegExp('(^|[^a-z])'+reEsc(k)+'($|[^a-z])').test(n))) out.tipos.push(t.id)});
  const ym=n.match(/\b(20\d{2})\b/);if(ym) out.year=ym[1];
  if(/\bvigente|actual|ultim[oa]|mas reciente\b/.test(n)) out.vigente=true;
  // Trabajador: busca nombres conocidos en el catálogo (2+ palabras o apellido)
  const workers=[...new Set(S.docs.map(d=>d.trabajador).filter(Boolean))];
  let best=null,bs=0;
  workers.forEach(w=>{const parts=norm(w).split(/\s+/);const sc=parts.filter(p=>p.length>2&&new RegExp('(^|[^a-z])'+p+'($|[^a-z])').test(n)).length;if(sc>bs){bs=sc;best=w}});
  if(best) out.trabajador=best;
  const used=new Set();
  if(cli) cli.alias.concat([cli.corto,cli.nombre]).forEach(a=>norm(a).split(/[^a-z0-9]+/).forEach(w=>used.add(w)));
  out.tipos.forEach(id=>{const t=tipoById(id);t.q.concat(norm(t.nombre).split(' ')).forEach(w=>used.add(norm(w)))});
  if(best) norm(best).split(/\s+/).forEach(w=>used.add(w));
  ['vigente','actual','reciente'].forEach(w=>used.add(w));
  out.rest=n.split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!used.has(w)&&!STOP.has(w)&&w!==out.year);
  return out;
}
function applyParsed(p){
  const f=emptyFilters();f.pend=S.f.pend;f.vig=p.vigente?'vigentes':'todas';
  if(p.cliente) f.cliente=p.cliente;
  f.tipos=p.tipos.slice();
  if(p.trabajador) f.trabajador=p.trabajador;
  if(p.year){f.desde=p.year+'-01-01';f.hasta=p.year+'-12-31';}
  S.f=f;S.freeText=p.rest;
}

/* =====================================================================
   Búsqueda y filtros
   ===================================================================== */
function visible(d){return true}   // la privacidad la garantizan los permisos de SharePoint
function matches(d,f,txt,{ignoreVig=false}={}){
  if(f.cliente&&d.clienteId!==f.cliente) return false;
  if(f.tipos.length&&!f.tipos.includes(d.tipo)) return false;
  if(f.trabajador&&!norm(d.trabajador).includes(norm(f.trabajador))) return false;
  if(f.desde&&(!d.fecha||d.fecha<f.desde)) return false;
  if(f.hasta&&(!d.fecha||d.fecha>f.hasta)) return false;
  if(!ignoreVig&&f.vig==='vigentes'&&!d.vigente) return false;
  if(!ignoreVig&&f.vig==='historico'&&d.vigente) return false;
  if(f.abogado&&d.abogado!==f.abogado) return false;
  if(f.formatos.length&&!f.formatos.includes(d.kind)) return false;
  if(txt&&txt.length){
    const inContent=S.contentHits&&S.contentHits.has(decodeURIComponent(d.url||''));
    if(!inContent&&!txt.every(w=>d._hay.includes(w))) return false;
  }
  return true;
}
function runSearch(){
  const t0=performance.now();
  const f=S.f,txt=S.freeText||[];
  const base=S.docs.filter(visible);
  let res=base.filter(d=>d.estado==='Validado'&&matches(d,f,txt));
  const pend=f.pend?base.filter(d=>d.estado==='Pendiente CID'&&matches(d,{...f,vig:'todas'},txt)):[];
  const hiddenOld=f.vig==='vigentes'?base.filter(d=>d.estado==='Validado'&&!d.vigente&&matches(d,f,txt,{ignoreVig:true})).length:0;
  const score=d=>(d.vigente?100:0)+(txt.length&&txt.some(w=>norm(d.nombre).includes(w))?20:0)+(d.fecha?+d.fecha.slice(0,4)-2000:0)/10;
  const cmp={rel:(a,b)=>score(b)-score(a)||(b.fecha||'').localeCompare(a.fecha||''),
    new:(a,b)=>(b.fecha||'').localeCompare(a.fecha||''),old:(a,b)=>(a.fecha||'').localeCompare(b.fecha||''),
    name:(a,b)=>a.nombre.localeCompare(b.nombre,'es'),cli:(a,b)=>cliName(a.clienteId).localeCompare(cliName(b.clienteId),'es')||(b.fecha||'').localeCompare(a.fecha||'')}[S.sort];
  res.sort(cmp);
  const ms=Math.round(performance.now()-t0);
  return {res,pend,hiddenOld,ms};
}
function hasCriteria(){const f=S.f;return !!(f.cliente||f.tipos.length||f.trabajador||f.desde||f.hasta||f.abogado||f.formatos.length||(S.freeText&&S.freeText.length)||f.vig==='historico')}
function activeCount(){const f=S.f;return [f.cliente,f.tipos.length,f.trabajador,f.desde||f.hasta,f.abogado,f.formatos.length,f.vig!=='todas'].filter(Boolean).length}

async function submitQuery(q){
  S.q=q.trim();S.limit=20;
  if(!S.q){S.freeText=[];render();return}
  const p=parseQuery(S.q);applyParsed(p);
  S.contentHits=null;
  if(false&&S.source==='graph'&&S.cfg.contentSearch&&p.rest.length)/* desactivado: /search/query no funciona con Sites.Selected */{try{S.contentHits=await GraphSource.contentHits(S.cfg,p.rest.join(' '))}catch(e){toast('La búsqueda en el contenido falló; se usan solo los campos')}}
  const r=runSearch();
  const entry={id:uid('l'),at:new Date().toISOString(),q:S.q,n:r.res.length,pend:r.pend.length,res:r.res.length?'Encontrado':r.pend.length?'En revisión del CID':'No figura',ms:r.ms,abierto:null,ok:null};
  S.log.push(entry);saveLog();S.lastLog=entry.id;
  render();
  if(innerWidth<900){const h=$('.rhead');if(h){document.activeElement&&document.activeElement.blur();h.scrollIntoView({block:'start'});scrollBy(0,-70)}}   // en el celular, mostrar resultados
}

  return `<div class="rhead"><h2>Catálogo</h2><span class="grow"></span><button class="btn sm fbtn" data-act="openSheet">${ICON.filter}Filtros${n?` (${n})`:''}</button></div>
  <div class="welcome"><div class="panel"><b>${val.length}</b><span>documentos validados</span></div><div class="panel"><b>${new Set(val.map(d=>d.clienteId)).size}</b><span>clientes</span></div><div class="panel"><b>${S.docs.filter(d=>d.estado==='Pendiente CID'&&visible(d)).length}</b><span>en revisión del CID</span></div></div>
  <div class="recent"><h3>Ingresados recientemente</h3><div class="list">${recent.map(d=>card(d,false)).join('')}</div></div>`;
}

/* Detalle */
function openDoc(id){
  const d=S.docs.find(x=>x.id===id);if(!d) return;
  const lg=S.lastLog&&S.log.find(l=>l.id===S.lastLog);
  if(lg&&!lg.abierto){lg.abierto=new Date().toISOString();lg.doc=d.nombre;saveLog();}
  const t=tipoById(d.tipo);const nuevo=d.reemplazadoPor&&S.docs.find(x=>x.id===d.reemplazadoPor||x.nombre===d.reemplazadoPor||x.spId===String(d.reemplazadoPor));
  const rows=[['Cliente',(clientById(d.clienteId)||{}).nombre||d.clienteId||'Sin cliente'],['Tipo',t.nombre],['Fecha del documento',fmtDate(d.fecha)],['Vigencia',d.vigencia],
    ['Trabajador',d.trabajador||'—'],['Reenviado por',d.abogado||'—'],['Correo de origen',d.origen||'—'],['Ingresó al catálogo',fmtDate(d.registrado)],
    ['Veces recibido',d.recepciones||1],['Estado',d.estado],['Formato / tamaño',(FORMATOS[d.kind]||d.kind.toUpperCase())+' · '+fmtSize(d.size)]];
  $('#modalRoot').innerHTML=`<div class="scrim" data-scrim><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(d.nombre)}">
    <div class="dh"><span class="ext ${d.kind}">${esc(extOf(d.nombre).toUpperCase())}</span><h3>${esc(d.nombre)}<span class="path xs muted" style="display:block;font-weight:500;margin-top:4px">SharePoint › ${esc(LIB_DEMO)} › ${esc(cliName(d.clienteId))} › ${esc(t.corto)}</span></h3><button class="btn sm ghost" data-close aria-label="Cerrar">✕</button></div>
    <div class="db">
      ${nuevo?`<div class="confirm" style="font-weight:500">Hay una versión más reciente. Esta se conserva en el historial. <button class="btn sm" data-open="${nuevo.id}">Ver la del ${fmtDate(nuevo.fecha)}</button></div>`:d.vencido?'<div class="warnbox">La vigencia de este documento ya venció.</div>':''}
      <div class="actions"><a class="btn primary" href="${esc(d.url)}" target="_blank" rel="noopener" data-act="openSp">Abrir en SharePoint</a><button class="btn" data-copy="${esc(d.url)}">Copiar enlace</button></div>
      ${lg&&lg.ok==null?`<div class="confirm">¿Es el documento que buscabas? <span class="grow"></span><button class="btn sm" data-ok="1">Sí, es este</button><button class="btn sm" data-ok="0">No</button></div>`:''}
      <div class="sec"><h4>Datos del catálogo</h4><dl class="meta">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>
      ${d.texto?`<div class="sec"><h4>Texto extraído</h4><div class="preview">${esc(d.texto)}</div></div>`:''}
      ${S.source==='mock'?'<p class="xs muted">Datos simulados: el enlace apunta a una ruta de ejemplo.</p>':''}
    </div></div></div>`;
}
function closeModal(){$('#modalRoot').innerHTML=''}

/* Registro de búsquedas (medición del piloto) */
function viewLog(){
  const L=S.log.slice().reverse();
  const tot=L.length,enc=L.filter(l=>l.res==='Encontrado').length,conf=L.filter(l=>l.ok===true).length;
  const mins=L.filter(l=>l.abierto).map(l=>(new Date(l.abierto)-new Date(l.at))/1000).sort((a,b)=>a-b);
  const med=mins.length?mins[Math.floor(mins.length/2)]:null;
  return `<div class="page"><h1>Registro de búsquedas</h1><p>Cada búsqueda queda anotada con su hora, resultado y si el abogado confirmó el documento. Es lo que se compara con la línea base en el piloto. En esta demo se guarda solo en este navegador.</p>
  <div class="kpis"><div><span>Búsquedas</span><b>${tot}</b></div><div><span>Con resultado</span><b>${tot?Math.round(enc*100/tot):0}%</b></div><div><span>Confirmadas</span><b>${conf}</b></div><div><span>Mediana hasta abrir</span><b>${med==null?'—':med<60?Math.round(med)+' s':(med/60).toFixed(1).replace('.',',')+' min'}</b></div></div>
  <div class="panel blk"><div class="rhead"><h2>Detalle</h2><span class="grow"></span><button class="btn sm" data-act="csv" ${tot?'':'disabled'}>Descargar CSV</button><button class="btn sm ghost" data-act="clearLog" ${tot?'':'disabled'}>Borrar</button></div>
  <div class="tw"><table class="t"><thead><tr><th>Hora</th><th>Búsqueda</th><th>Resultado</th><th>Abrió</th><th>¿Confirmado?</th></tr></thead><tbody>
  ${L.length?L.map(l=>`<tr><td>${new Date(l.at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(l.q)}</td><td>${l.res==='Encontrado'?`<span class="chip ok">${l.n} encontrados</span>`:l.res==='No figura'?'<span class="chip warn">No figura</span>':`<span class="chip adj">${esc(l.res)}</span>`}</td><td>${l.abierto?esc(l.doc||'Sí'):'—'}</td><td>${l.ok===true?'Sí':l.ok===false?'No':'—'}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no hay búsquedas.</td></tr>'}
  </tbody></table></div></div>
  <p class="xs muted">En producción: guardar cada fila en una lista SharePoint «Registro de búsquedas» (POST /sites/{id}/lists/{id}/items) o en Application Insights.</p></div>`;
}

/* Conexión a SharePoint */
function viewConn(){
  const c=S.cfg;
  return `<div class="page"><h1>Conexión con SharePoint</h1><p>El buscador funciona con datos simulados. Para usar la biblioteca real del catálogo (la que llena la fase 1), completa estos datos. La guía paso a paso está en <b>LEEME.md</b>, junto a este archivo.</p>
  <div class="panel blk"><h2>1. Aplicación y sitio</h2><p>Del registro de la aplicación en Microsoft Entra ID (tipo «Aplicación de página única», permiso delegado <code>Sites.Selected</code>, con lectura asignada solo al sitio YTLP).</p>
   <div class="cgrid">
    <div class="field"><label for="c-ten">Id. de inquilino (tenant)</label><input id="c-ten" type="text" data-c="tenantId" value="${esc(c.tenantId)}" placeholder="00000000-0000-0000-0000-000000000000"></div>
    <div class="field"><label for="c-cli">Id. de aplicación (cliente)</label><input id="c-cli" type="text" data-c="clientId" value="${esc(c.clientId)}" placeholder="00000000-0000-0000-0000-000000000000"></div>
    <div class="field"><label for="c-site">URL del sitio SharePoint</label><input id="c-site" type="url" data-c="siteUrl" value="${esc(c.siteUrl)}"></div>
    <div class="field"><label for="c-lib">Biblioteca del catálogo</label><input id="c-lib" type="text" data-c="library" value="${esc(c.library)}"></div>
   </div>
   <p class="xs muted">URI de redirección que debes registrar: <code>${esc(location.origin+location.pathname)}</code></p>
   ${location.protocol==='http:'&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'<div class="status bad">Esta página se abrió por http. El inicio de sesión de Microsoft exige https: publícala con certificado (por ejemplo https://portal.vinateatoyama.com/ytlp/).</div>':''}</div>
  <div class="panel blk"><h2>2. Columnas de la biblioteca</h2><p>Nombre interno de cada columna que llena el flujo de la fase 1 (paso 16). Cambia solo si en tu biblioteca se llaman distinto.</p>
   <div class="tw"><table class="t maptbl"><thead><tr><th>Campo del buscador</th><th>Nombre interno en SharePoint</th></tr></thead><tbody>
   ${Object.entries(c.map).map(([k,v])=>`<tr><td>${esc(k)}</td><td><input data-map="${k}" value="${esc(v)}" aria-label="Columna para ${esc(k)}"></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel blk"><h2>3. Probar</h2>
   <div class="actions" style="max-width:520px"><button class="btn primary" data-act="connect" ${c.tenantId&&c.clientId?'':'disabled'}>Conectar e iniciar sesión</button><button class="btn" data-act="useMock">Usar datos simulados</button></div>
   ${S.connMsg?`<div class="status ${S.connMsg.c}">${esc(S.connMsg.t)}</div>`:''}
   <p class="xs muted" style="margin-top:10px">Debe abrirse desde una dirección https (o http://localhost) que coincida con la URI de redirección. Desde un archivo local (file://) el inicio de sesión no funciona.</p></div></div>`;
}

/* =====================================================================
   Eventos
   ===================================================================== */
function route(){const h=location.hash.slice(1);S.view=TABS.some(t=>t[0]===h)?h:'buscar';S.sheet=false;render();scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.addEventListener('submit',e=>{if(e.target.id==='sform'){e.preventDefault();submitQuery(e.target.q.value)}});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.f!==undefined){S.f[d.f]=el.value;S.limit=20;render();return}
  if(d.ft){S.f.tipos=el.checked?S.f.tipos.concat(d.ft):S.f.tipos.filter(x=>x!==d.ft);render();return}
  if(d.ff){S.f.formatos=el.checked?S.f.formatos.concat(d.ff):S.f.formatos.filter(x=>x!==d.ff);render();return}
  if(d.fb){S.f[d.fb]=el.checked;render();return}
  if(el.id==='sort'){S.sort=el.value;render();return}
  if(d.c){S.cfg[d.c]=el.type==='checkbox'?el.checked:el.value.trim();store('ytlp-f2-cfg',S.cfg);render();return}
  if(d.map){S.cfg.map[d.map]=el.value.trim();store('ytlp-f2-cfg',S.cfg);return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-trab'&&!e.target.value){S.f.trabajador='';render();return}
  if(e.target.id==='f-cli-q'){fillClientList(e.target.value);if(!e.target.value&&S.f.cliente){S.f.cliente='';render();setTimeout(()=>{const i=$('#f-cli-q');if(i){i.focus();fillClientList('')}},0)}}
});
document.addEventListener('focusin',e=>{if(e.target.id==='f-cli-q'){e.target.select();fillClientList('')}});
document.addEventListener('focusout',e=>{if(e.target.id==='f-cli-q') setTimeout(()=>{if(document.activeElement&&document.activeElement.id==='f-cli-q') return;closeClientList();const i=$('#f-cli-q');if(i) i.value=S.f.cliente?cliName(S.f.cliente):''},180)});
document.addEventListener('mousedown',e=>{const li=e.target.closest('#f-cli-list li[data-cli]');if(li){e.preventDefault();pickClient(li.dataset.cli)}});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='f-cli-q') return;
  const ul=$('#f-cli-list'),o=S._cliOpts||[];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(ul.hidden) fillClientList(e.target.value);S._cliIdx=Math.max(0,Math.min(o.length-1,(S._cliIdx||0)+(e.key==='ArrowDown'?1:-1)));[...ul.children].forEach((li,i)=>li.classList.toggle('act',i===S._cliIdx));const a=ul.children[S._cliIdx];a&&a.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();if(o[S._cliIdx||0]) pickClient(o[S._cliIdx||0].id)}
  else if(e.key==='Escape'){e.stopPropagation();closeClientList()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(S.sheet){S.sheet=false;render()}}});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,[data-scrim]');if(!t) return;
  if(t.hasAttribute('data-scrim')){if(e.target===t) closeModal();return}
  if(t.hasAttribute('data-close')){closeModal();return}
  const d=t.dataset;
  if(d.open){openDoc(d.open);return}
  if(d.ex){$('#q').value=d.ex;submitQuery(d.ex);return}
  if(d.vig){S.f.vig=d.vig;render();return}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast('Enlace copiado')}catch(_){toast('No se pudo copiar')}return}
  if(d.ok!==undefined){const l=S.log.find(x=>x.id===S.lastLog);if(l){l.ok=d.ok==='1';saveLog()}closeModal();toast(d.ok==='1'?'Gracias: queda como búsqueda exitosa':'Anotado: no era el documento');return}
  if(d.rm){const k=d.rm,f=S.f;
    if(k==='cliente') f.cliente='';else if(k==='trabajador') f.trabajador='';else if(k==='fechas'){f.desde='';f.hasta=''}
    else if(k==='abogado') f.abogado='';
    else if(k.startsWith('tipo:')) f.tipos=f.tipos.filter(x=>x!==k.slice(5));else if(k.startsWith('fmt:')) f.formatos=f.formatos.filter(x=>x!==k.slice(4));
    else if(k.startsWith('txt:')) S.freeText=(S.freeText||[]).filter(x=>x!==k.slice(4));
    S.q='';render();return}
  switch(d.act){
    case 'cliClear':S.f.cliente='';render();break;
    case 'clear':S.q='';S.freeText=[];S.f=emptyFilters();render();$('#q')&&$('#q').focus();break;
    case 'reset':S.q='';S.freeText=[];S.f=emptyFilters();render();break;
    case 'more':S.limit+=20;render();break;
    case 'openSheet':S.sheet=true;render();break;
    case 'closeSheet':S.sheet=false;render();break;
    case 'req':{const l=S.log.find(x=>x.id===S.lastLog);if(l){l.pedido=true;saveLog()}break}
    case 'csv':{const cols=['at','q','res','n','pend','abierto','doc','ok','pedido'];const csv=[cols.join(';')].concat(S.log.map(l=>cols.map(c=>'"'+String(l[c]??'').replace(/"/g,'""')+'"').join(';'))).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='registro_busquedas_ytlp.csv';a.click();break}
    case 'clearLog':if(confirm('¿Borrar el registro de este navegador?')){S.log=[];saveLog();render()}break;
    case 'connect':case 'login':S.source='graph';S.loginErr=null;store('ytlp-f2-src2','graph');S.connMsg={c:'run',t:'Conectando… se abrirá el inicio de sesión de Microsoft.'};render();await loadData(true);break;
    case 'useMock':S.source='mock';S.needLogin=false;S.loginErr=null;store('ytlp-f2-src2','mock');S.connMsg=null;location.hash='buscar';await loadData();break;
  }
});
route();
loadData();
</script>
</body>
</html>
